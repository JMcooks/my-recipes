<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的家常食譜</title>
    <style>
        :root {
            --primary-color: #2e7d32; 
            --bg-color: #ffffff;
            --text-color: #212121;
            --card-bg: #f9f9f9;
        }

        body {
            font-family: "Microsoft JhengHei", "微軟正黑體", sans-serif;
            margin: 0;
            padding: 15px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 22px; /* Slightly larger for easier reading */
        }

        header { text-align: center; padding: 20px 0; border-bottom: 2px solid #eee; }
        h1 { margin: 0; color: var(--primary-color); font-size: 2.2rem; }

        .search-container {
            margin: 25px 0;
            background: #e8f5e9;
            padding: 20px;
            border-radius: 15px;
        }

        label { display: block; font-weight: bold; margin-bottom: 10px; }

        input, select {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border: 3px solid #2e7d32; /* Thicker border for clarity */
            border-radius: 10px;
            font-size: 20px;
            box-sizing: border-box;
        }

        .recipe-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .recipe-card {
            background: var(--card-bg);
            border: 2px solid #ddd;
            border-radius: 15px;
            padding: 20px;
        }

        .recipe-card h2 { margin-top: 0; color: var(--primary-color); font-size: 24px; }
        .tag {
            display: inline-block;
            background: #2e7d32;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 16px;
            margin-right: 5px;
            font-weight: bold;
        }

        .ingredients-list { font-size: 20px; line-height: 1.6; margin: 15px 0; }
    </style>
</head>
<body>

<header>
    <h1>我的家常食譜</h1>
</header>

<div class="search-container">
    <label for="fridgeSearch">🛒 你的雪櫃有什麼食材？</label>
    <input type="text" id="fridgeSearch" placeholder="輸入食材 (例如：雞蛋)..." onkeyup="filterRecipes()">

    <label for="cuisineSelect">🌏 菜系選擇</label>
    <select id="cuisineSelect" onchange="filterRecipes()">
        <option value="">全部菜系</option>
        <option value="中菜">中菜 (Chinese)</option>
        <option value="泰國菜">泰國菜 (Thai)</option>
        <option value="越南菜">越南菜 (Viet)</option>
        <option value="日本菜">日本菜 (Japanese)</option>
        <option value="韓國菜">韓國菜 (Korean)</option>
        <option value="西式">西式 (Western)</option>
        <option value="多國菜">多國菜 (Fusion)</option>
    </select>
    
    <label for="methodSelect">🍳 烹飪方法</label>
    <select id="methodSelect" onchange="filterRecipes()">
        <option value="">全部方法</option>
        <option value="炒">清炒 / 小炒</option>
        <option value="蒸">清蒸</option>
        <option value="快煮">汁煮 / 水煮</option>
        <option value="慢煮">炆 / 燉</option>
         <option value="湯">煲湯 / 燉湯</option>
        <option value="焗">烘焙 / 焗</option>
        <option value="焗">涼拌 / 冷盤</option>
         <option value="醬汁">醬汁</option>
    </select>
</div>

<div id="recipeList" class="recipe-list">
    <!-- Recipes will appear here -->
</div>

<script>
    // 數據庫：在這裡添加你的食譜資料
    const myRecipes = [
        {
            name: "豬扒五香汁",
            image: "tomato-egg.jpg",
            cuisine: "多國菜",
            ingredients: ["1.5大匙煉奶", "1大匙蠔油", "1大匙豉油", "1大匙蜜糖／砂糖", "1粒蒜泥", "1／4小匙五香粉", "1／4小匙黑椒", ", "1／4小匙鹽", "油少許"],
            method: "醬汁", "汁煮"
            prep time: "10 分鐘",
            cooking time: "15 分鐘",
            youtube: "https://www.instagram.com/reel/DOWM8GlDYU3/?igsh=b2YwZThvNXV3a21v", // 放入具體的影片網址
            instructions: "先將醃料拌勻，倒在豬扒醃1至2小時（放雪櫃），最後煎豬扒。"
        },
        {
            name: "泰式冬蔭功湯",
            image: "tom-yum.jpg",
            cuisine: "泰國菜",
            ingredients: ["蝦", "香茅", "青檸", "辣椒"],
            method: "湯",
            time: "30 分鐘",
            youtube: "https://www.youtube.com/results?search_query=冬蔭功",
            instructions: "將香料煮滾出味，加入蝦及調味料，最後下青檸汁。"
        }
    ];

    function displayRecipes(data) {
        const container = document.getElementById('recipeList');
        container.innerHTML = '';

        if(data.length === 0) {
            container.innerHTML = '<p style="text-align:center; padding: 20px;">找不到相關食譜，試試其他搜尋條件吧！</p>';
            return;
        }

        data.forEach(recipe => {
            const card = document.createElement('div');
            card.className = 'recipe-card';
            
            const imageSrc = recipe.image ? recipe.image : "https://via.placeholder.com/400x220?text=無圖片";

            card.innerHTML = `
                <img src="${imageSrc}" alt="${recipe.name}" class="recipe-img">
                <div class="recipe-content">
                    <h2>${recipe.name}</h2>
                    <div class="tag-group">
                        <span class="tag cuisine">🌏 ${recipe.cuisine}</span>
                        <span class="tag">⏱ ${recipe.time}</span>
                        <span class="tag">🔥 ${recipe.method}</span>
                    </div>
                    <p class="ingredients-list"><strong>材料：</strong> ${recipe.ingredients.join('、')}</p>
                    <p><strong>煮法：</strong><br>${recipe.instructions}</p>
                    ${recipe.youtube ? `<a href="${recipe.youtube}" target="_blank" class="yt-button">▶ 觀看 YouTube 教學影片</a>` : ''}
                </div>
            `;
            container.appendChild(card);
        });
    }

    function filterRecipes() {
        const searchText = document.getElementById('fridgeSearch').value.toLowerCase();
        const selectedCuisine = document.getElementById('cuisineSelect').value;
        const selectedMethod = document.getElementById('methodSelect').value;

        const filtered = myRecipes.filter(recipe => {
            const matchesIngredient = recipe.ingredients.some(ing => ing.includes(searchText)) || recipe.name.includes(searchText);
            const matchesCuisine = selectedCuisine === "" || recipe.cuisine === selectedCuisine;
            const matchesMethod = selectedMethod === "" || recipe.method === selectedMethod;
            
            return matchesIngredient && matchesCuisine && matchesMethod;
        });

        displayRecipes(filtered);
    }

    // 初始載入
    displayRecipes(myRecipes);
</script>

</body>
</html>
