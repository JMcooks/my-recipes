<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的家常食譜</title>
    <style>
        :root {
            --primary-color: #2e7d32; 
            --bg-color: #ffffff;
            --text-color: #212121;
            --card-bg: #f9f9f9;
        }

        body {
            font-family: "Microsoft JhengHei", "微軟正黑體", sans-serif;
            margin: 0;
            padding: 15px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 22px; /* Slightly larger for easier reading */
        }

        header { text-align: center; padding: 20px 0; border-bottom: 2px solid #eee; }
        h1 { margin: 0; color: var(--primary-color); font-size: 2.2rem; }

        .search-container {
            margin: 25px 0;
            background: #e8f5e9;
            padding: 20px;
            border-radius: 15px;
        }

        label { display: block; font-weight: bold; margin-bottom: 10px; }

        input, select {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border: 3px solid #2e7d32; /* Thicker border for clarity */
            border-radius: 10px;
            font-size: 20px;
            box-sizing: border-box;
        }

        .recipe-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .recipe-card {
            background: var(--card-bg);
            border: 2px solid #ddd;
            border-radius: 15px;
            padding: 20px;
        }

        .recipe-card h2 { margin-top: 0; color: var(--primary-color); font-size: 24px; }
        .tag {
            display: inline-block;
            background: #2e7d32;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 16px;
            margin-right: 5px;
            font-weight: bold;
        }

        .ingredients-list { font-size: 20px; line-height: 1.6; margin: 15px 0; }
    </style>
</head>
<body>

<header>
    <h1>我的家常食譜</h1>
</header>

<div class="search-container">
    <label for="fridgeSearch">🛒 你的雪櫃有什麼食材？</label>
    <input type="text" id="fridgeSearch" placeholder="輸入食材 (例如：雞蛋)..." onkeyup="filterRecipes()">

    <label for="methodSelect">🍳 烹飪方法</label>
    <select id="methodSelect" onchange="filterRecipes()">
        <option value="">全部方法</option>
        <option value="炒">清炒 / 小炒</option>
        <option value="蒸">清蒸</option>
        <option value="快煮">汁煮 / 水煮</option>
        <option value="慢煮">炆 / 燉</option>
         <option value="湯">煲湯 / 燉湯</option>
        <option value="焗">烘焙 / 焗</option>
        <option value="焗">涼拌 / 冷盤</option>
    </select>
</div>

<div id="recipeList" class="recipe-list">
    <!-- Recipes will appear here -->
</div>

<script>
    // 數據庫：在這裡添加你的食譜
    const myRecipes = [
        {
            name: "番茄炒蛋",
            ingredients: ["雞蛋", "番茄", "蔥"],
            method: "炒",
            time: "10 分鐘",
            instructions: "先炒熟雞蛋盛起，再煮軟番茄，最後加入雞蛋拌勻。"
        },
        {
            name: "蒜蓉蒸魚",
            ingredients: ["魚", "蒜蓉", "豉油", "薑"],
            method: "蒸",
            time: "15 分鐘",
            instructions: "魚身鋪上薑絲，蒸8分鐘，淋上蒜蓉熟油及豉油。"
        }
    ];

    function displayRecipes(data) {
        const container = document.getElementById('recipeList');
        container.innerHTML = '';

        if(data.length === 0) {
            container.innerHTML = '<p style="text-align:center;">找不到相關食譜，試試其他食材吧！</p>';
            return;
        }

        data.forEach(recipe => {
            const card = document.createElement('div');
            card.className = 'recipe-card';
            card.innerHTML = `
                <h2>${recipe.name}</h2>
                <span class="tag">⏱ ${recipe.time}</span>
                <span class="tag">🔥 ${recipe.method}</span>
                <p class="ingredients-list"><strong>材料：</strong> ${recipe.ingredients.join('、')}</p>
                <p><strong>煮法：</strong><br>${recipe.instructions}</p>
            `;
            container.appendChild(card);
        });
    }

    function filterRecipes() {
        const searchText = document.getElementById('fridgeSearch').value.toLowerCase();
        const selectedMethod = document.getElementById('methodSelect').value;

        const filtered = myRecipes.filter(recipe => {
            const matchesIngredient = recipe.ingredients.some(ing => ing.includes(searchText)) || recipe.name.includes(searchText);
            const matchesMethod = selectedMethod === "" || recipe.method === selectedMethod;
            return matchesIngredient && matchesMethod;
        });

        displayRecipes(filtered);
    }

    displayRecipes(myRecipes);
</script>

</body>
</html>
